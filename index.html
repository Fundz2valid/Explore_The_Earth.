<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Explore the Earth</title></head><body>
<div class="app">
  <header class="hero">
    <div class="logo">🌍</div>
    <h1>Explore the Earth</h1>
    <p>Discover countries, capitals, popular places, famous people and national days.</p>
  </header>

  <section class="explorer">
    <h2>Countries of the World</h2>
    <div class="continents" id="continents">
      <button class="active" data-c="All">🌎 All</button>
      <button data-c="Africa">🌍 Africa</button>
      <button data-c="Asia">🌏 Asia</button>
      <button data-c="Europe">🇪🇺 Europe</button>
      <button data-c="North America">🌎 North America</button>
      <button data-c="South America">🌎 South America</button>
      <button data-c="Oceania">🌊 Oceania</button>
      <button data-c="Antarctica">🧊 Antarctica</button>
    </div>
    <input id="search" placeholder="🔎 Search country..." />
    <div id="count"></div>
    <div id="countries"></div>
  </section>

  <section id="info" class="info">
    <h2>🌍 Select a country</h2>
    <p>Tap a country above to see its information.</p>
  </section>
</div>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#081b29,#123d50,#1d2345);color:#fff;min-height:100vh}
.app{max-width:1100px;margin:auto;padding:22px 15px 50px}
.hero{text-align:center;padding:35px 15px 30px}
.logo{font-size:75px}
.hero h1{margin:8px 0;font-size:clamp(38px,8vw,70px);font-weight:900}
.hero p{opacity:.78;font-size:16px}
.explorer,.info{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:20px;margin-bottom:18px;backdrop-filter:blur(10px)}
.explorer h2{text-align:center;margin-top:0}
.continents{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0}
.continents button{border:0;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.12);color:white;font-weight:700;cursor:pointer}
.continents button.active,.continents button:hover{background:#348fe8}
#search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.2);color:white;font-size:16px;outline:none;margin-bottom:12px}
#search::placeholder{color:white;opacity:.6}
#count{text-align:center;opacity:.7;margin:8px}
#countries{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
.country{border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:13px;background:rgba(255,255,255,.08);color:white;text-align:left;cursor:pointer}
.country:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.country b{display:block;font-size:15px}.country small{opacity:.6}
.info h2{margin-top:0}.info p{line-height:1.55}
@media(max-width:500px){#countries{grid-template-columns:repeat(2,minmax(0,1fr))}.continents button{font-size:12px;padding:8px 10px}}
</style>

const continentCountries = {

const all = [];
for (const [continent, names] of Object.entries(continentCountries)) {
  for (const name of names) {
    const d = details[name] || {};
    all.push({
      name, continent,
      capital: d.capital || "Information not available",
      places: d.places || "Information not available",
      person: d.person || "Information not available",
      day: d.day || "Information not available"
    });
  }
}
const unique = Array.from(new Map(all.map(x => [x.name, x])).values())
  .sort((a,b) => a.name.localeCompare(b.name));

let current = "All";
const grid = document.getElementById("countries");
const count = document.getElementById("count");
const search = document.getElementById("search");
const info = document.getElementById("info");

function safe(x){
  return String(x).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function render(){
  const q = search.value.toLowerCase().trim();
  const list = unique.filter(c =>
    (current==="All" || c.continent===current) &&
    (!q || c.name.toLowerCase().includes(q))
  );
  count.textContent = list.length + " countries shown";
  grid.innerHTML = list.map(c =>
    '<button class="country" data-name="'+safe(c.name)+'">' +
    '<b>🌍 '+safe(c.name)+'</b><small>'+safe(c.continent)+'</small></button>'
  ).join("");
  grid.querySelectorAll(".country").forEach(b =>
    b.onclick = () => show(b.dataset.name)
  );
}

function show(name){
  const c = unique.find(x => x.name === name);
  if(!c) return;
  info.innerHTML =
    "<h2>🌍 "+safe(c.name)+"</h2>"+
    "<p><b>🌎 Continent:</b> "+safe(c.continent)+"</p>"+
    "<p><b>🏛️ Capital:</b> "+safe(c.capital)+"</p>"+
    "<p><b>📍 Popular places:</b> "+safe(c.places)+"</p>"+
    "<p><b>⭐ Famous person:</b> "+safe(c.person)+"</p>"+
    "<p><b>🎉 National/Independence day:</b> "+safe(c.day)+"</p>";
  info.scrollIntoView({behavior:"smooth",block:"nearest"});
}

document.querySelectorAll("#continents button").forEach(b => {
  b.onclick = () => {
    current=b.dataset.c;
    document.querySelectorAll("#continents button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
});
search.oninput=render;
render();
</script>
</body></html>
